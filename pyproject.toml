[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xhs-discovery"
version = "0.0.1"
description = "小红书长尾需求发现引擎（P0 离线闭环）"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9",
  "PyYAML>=6.0",
  "networkx>=3.2",
  "streamlit>=1.40",
  "pydeck>=0.9",
  "jieba>=0.42.1",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# 语义增强为可选安装项：关闭模型时不导入这些重型依赖，也不下载权重。
embedding = ["sentence-transformers>=3"]
llm = ["httpx>=0.27"]

[project.scripts]
xhs-discovery = "xhs_discovery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xhs_discovery = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
