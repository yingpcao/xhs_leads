# P0 端到端演示与冒烟用配置：预算小，但收敛判据保持与 DEVELOPMENT_PLAN.md 第 5.3 节一致。
# 本配置只有 14 次联想预算，达不到"至少 50 次成功联想观察"，因此演示必然以
# budget_exhausted / queue_exhausted 结束，而不是 converged；不得为了让界面展示收敛而下调门槛。
# 需要验证收敛策略时，使用 config/tests-convergence-tiny.yaml（仅单元测试，不是产品演示）。

version: 1

run:
  seed_raw: "上海中考"
  mode: fixture
  random_seed: 20261024
  data_dir: data
  run_label: offline-demo

budget:
  suggest_attempts: 14
  search_attempts: 6
  body_attempts: 0
  author_attempts: 0
  calibration_suggest_attempts: 3
  max_posts_stored: 40
  max_runtime_minutes: 10
  model_calls: 0
  model_tokens: 0
  model_cost_usd: 0.0

sampling:
  high_value_posts: 3
  medium_value_posts: 1
  low_value_posts: 0
  priority_high: 0.60
  priority_medium: 0.35
  branch_min_validation_share: 1
  first_sample_posts: 0            # demo 与回归基线沿用旧口径（低档不采内容），改动会动证据数量断言

scheduler:
  slot_window: 6
  slots_high_score: 4
  slots_branch_exploration: 1
  slots_random_novelty: 1
  ucb_exploration_coefficient: 1.0
  unknown_evidence_prior: 0.5
  cluster_keyword_weight: 0.2
  max_depth: 5                     # 与 config/default.yaml 一致：纵向链条不靠预算兜底
  max_segment_repeats: 2           # 同一 2~3 字片段重复 >2 次判退化词，不入队
  operators: [suggest_vertical, phrase_fallback, content_lateral, problem_probe]
  weights: {r: 0.30, n: 0.20, i: 0.20, e: 0.10, c: 0.10, u: 0.10}

stopping:                       # 与 config/default.yaml 保持一致，演示不因小样本改写判据
  min_successful_suggestion_observations: 50
  convergence_window: 50
  new_problem_cluster_floor: 3
  repeat_rate_ceiling: 0.85
  branch_stall_trials: 15
  require_content_validation: true

scoring:
  weights: {s: 0.35, q: 0.30, a: 0.20, f: 0.15}
  log_scale: true
  quantile_min_sample: 30

nlp:
  char_ngram_min: 2
  char_ngram_max: 4
  min_phrase_freq: 2
  min_pmi: 0.5                        # 演示语料很小，阈值放低但仍要求"共现优于独立"
  tfidf_batch_size: 10
  domain_terms_path: config/domain_terms.txt
  intent_rules_path: config/intent_rules.yaml

retry:
  max_retries: 1
  backoff_base_seconds: 0.0
  engine_min_interval_seconds: 0.0

retention:
  raw_artifact_days: 30
  export_days: 30
  minimize_author_data: true

models:
  embedding_enabled: false
  llm_enabled: false

sources:
  fixture:
    dataset: shanghai_zhongkao
    base_path: tests/fixtures
